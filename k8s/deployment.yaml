apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-downtime-app
  labels:
    app: zero-downtime-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero-downtime-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: zero-downtime-app
    spec:
      containers:
      - name: zero-downtime-app
        image: zero-downtime-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "v1"
        - name: FAIL_HEALTH_CHECK
          value: "false"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
